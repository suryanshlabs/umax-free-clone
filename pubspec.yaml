name: facial_analysis
description: >-
  Offline facial geometry analysis. Google MediaPipe Face Mesh (468 landmarks)
  runs on the device through ML Kit; every measurement and score is computed
  locally in Dart. No network calls, no accounts, no uploads.
publish_to: "none"
version: 3.1.0+7

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # Camera preview + still capture.
  camera: ^0.11.0

  # Google's on-device face mesh detector (ML Kit Face Mesh Detection, the
  # production packaging of MediaPipe Face Mesh). Returns 468 3D landmarks.
  google_mlkit_face_mesh_detection: ^0.7.1

  # Google MediaPipe Tasks Vision: official Flutter wrapper for Face Landmarker.
  # The model (face_landmarker.task) is bundled at pub get time; never downloaded
  # at runtime. See the package README for asset bundle instructions.
  mediapipe_vision: ^0.1.3

  # Local state management for the analysis pipeline.
  provider: ^6.1.2
  # vector_math is included transitively via mediapipe_vision, kept for explicitness.
  vector_math: ^2.4.0

  # Gallery pick for the second input path. Uses Android's system picker, which
  # hands back a single user-chosen file and needs no storage permission.
  image_picker: ^1.1.2
  file_picker: ^13.3.2
  share_plus: ^13.3.1
  device_info_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true  # MediaPipe model assets are bundled at pub get time; the task file
  # is provided with the application and not included in this workspace.
  assets:
