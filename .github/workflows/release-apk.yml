name: Release APK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the APK to'
        required: true
        default: 'v1.2.0'

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the stable Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build the release APK
        run: flutter build apk --release

      - name: Verify the release manifest has no INTERNET permission
        run: |
          MANIFEST=build/app/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml
          if grep -q 'uses-permission android:name="android.permission.INTERNET"' "$MANIFEST"; then
            echo "::error::The release manifest requests android.permission.INTERNET"
            exit 1
          fi
          echo "OK: no INTERNET permission in the merged release manifest."

      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" build/app/outputs/flutter-apk/app-release.apk --clobber
