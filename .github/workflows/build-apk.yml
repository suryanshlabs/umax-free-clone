name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the stable Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build the release APK
        run: flutter build apk --release

      # The app is offline by design. A dependency that adds INTERNET would
      # break that promise silently, so the merged release manifest is checked
      # before the APK can be published.
      - name: Verify the release manifest has no INTERNET permission
        run: |
          MANIFEST=build/app/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml
          if grep -q 'uses-permission android:name="android.permission.INTERNET"' "$MANIFEST"; then
            echo "::error::The release manifest requests android.permission.INTERNET"
            exit 1
          fi
          echo "OK: no INTERNET permission in the merged release manifest."

      - name: Upload the APK as a downloadable artifact
        uses: actions/upload-artifact@v6
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
